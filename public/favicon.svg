<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hourHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect width="98" height="98" x="1" y="1" rx="22" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />
  <rect width="98" height="98" x="1" y="1" rx="22" fill="url(#ambientGlow)" />

  <!-- Outer Ring Track -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#27272a" stroke-width="1" />
  <circle cx="50" cy="50" r="31" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="1.5 5" stroke-linecap="round" opacity="0.75" />

  <!-- Major Cardinal Hour Markers -->
  <line x1="50" y1="19" x2="50" y2="24" stroke="#f4b400" stroke-width="2" stroke-linecap="round" />
  <line x1="81" y1="50" x2="76" y2="50" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="81" x2="50" y2="76" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="19" y1="50" x2="24" y2="50" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Hour Hand (~10:10 position) -->
  <line x1="50" y1="50" x2="35" y2="35" stroke="url(#hourHandGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#subtleShadow)" />

  <!-- Minute Hand (~10:10 position) -->
  <line x1="50" y1="50" x2="68" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleShadow)" />

  <!-- Second Hand / Accent Needle (Amber) -->
  <line x1="50" y1="50" x2="58" y2="67" stroke="#f4b400" stroke-width="1.2" stroke-linecap="round" opacity="0.95" />
  <circle cx="58" cy="67" r="1.6" fill="#f4b400" />

  <!-- Center Pivot Hub -->
  <circle cx="50" cy="50" r="4.5" fill="#09090b" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="50" cy="50" r="1.8" fill="#f4b400" />
</svg>
